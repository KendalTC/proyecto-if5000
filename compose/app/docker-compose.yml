version: '3.8'

services:
  app-adicional:
    image: node:20
    working_dir: /usr/src/app
    volumes:
      - ./app:/usr/src/app:cached
    command: sh -c "npm install --no-audit && npm start"
    ports:
      - "8081:8080"
    restart: unless-stopped

# Notes:
# - The app should expose port 8080 internally. Adjust ports as needed.
# - Alternatively, replace image with a built image and use build: ./app + Dockerfile.