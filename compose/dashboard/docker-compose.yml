services:
  dashboard:
    build: .
    container_name: dashboard-if5000
    ports:
      - "8001:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log/fail2ban.log:/var/log/fail2ban.log:ro
      - /var/log/suricata/eve.json:/var/log/suricata/eve.json:ro
    restart: always
