global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node_exporter'
    # Depending on the environment, node_exporter may be reached via host network or host.docker.internal
    static_configs:
      - targets: ['host.docker.internal:9100']

# Notes:
# - If Docker on the host does not provide host.docker.internal, run node_exporter with network_mode: host
#   or adjust targets to the host IP (e.g., 192.168.50.100:9100).